<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR Project Tracking</title>

  <!-- QR library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- 🔥 THIS LINE LOADS YOUR CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="wrap">
    <h2>QR Project Tracking</h2>

    <!-- Step indicator -->
    <div class="stepbar">
      <div class="step" id="step1">Employee</div>
      <div class="step" id="step2">Project</div>
      <div class="step" id="step3">Status</div>
    </div>

    <!-- Shared scanner -->
    <button id="start-scan">Scan QR Code</button>
    <div id="reader" style="width:100%; margin-top:10px;"></div>

    <div id="qr-result" class="hidden"></div>

    <!-- SCREEN 1 -->
    <section id="screen-employee" class="screen">
      <h3>Employee Info</h3>
      <div class="field"><b>Employee Name:</b> <span id="empName">-</span></div>
      <div class="field"><b>Employee No:</b> <span id="empNo">-</span></div>
      <div class="field"><b>Station:</b> <span id="empStation">-</span></div>

      <button id="to-project" class="secondary">Submit</button>
    </section>

    <!-- SCREEN 2 -->
    <section id="screen-project" class="screen hidden">
      <h3>Project Info</h3>
      <div class="field"><b>Project Name:</b> <span id="projectName">-</span></div>
      <div class="field"><b>Description:</b> <span id="description">-</span></div>
      <div class="field"><b>Material Number:</b> <span id="materialNumber">-</span></div>
      <div class="field"><b>Serial Number:</b> <span id="serialNumber">-</span></div>

      <button id="to-status" class="secondary">Submit</button>
    </section>

    <!-- SCREEN 3 -->
    <section id="screen-status" class="screen hidden">
      <h3>Status</h3>

      <label>Status:</label>
      <select id="status">
        <option value="Start Process">Start Process</option>
        <option value="End Process">End Process</option>
        <option value="Start Rework">Start Rework</option>
        <option value="End Rework">End Rework</option>
      </select>

      <label>Notes:</label>
      <div class="hint" id="notes-hint"></div>
      <input type="text" id="notes" placeholder="Enter notes" />
      

      <button id="submit-data">Submit</button>
    </section>

    <h3>Debug</h3>
    <div id="debug">Ready.</div>

    <script type="module" src="js/app.js"></script>
  </div>
</body>
</html>
