<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Process Timeline (Firestore processLogs)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body { font-family: Arial, sans-serif; padding: 16px; max-width: 1200px; margin: auto; }
    h2 { margin: 0 0 8px; }
    .hint { color:#555; font-size: 13px; margin: 8px 0 12px; }
    #legend { margin:10px 0 14px; font-size:13px; }
    #chart { height: 700px; }
    #status { font-size: 13px; background:#fafafa; border:1px solid #eee; padding:10px; border-radius:6px; white-space: pre-wrap; }
  </style>
</head>

<body>
  <h2>Process Gantt-Style Timeline</h2>

  <div class="hint">
    One row per <b>projectName (serialNumber)</b>. Tooltip shows employee and time. Rework is shown as a separate red segment.
  </div>

  <div id="legend">
    <b>Legend:</b>
    <span style="margin-left:10px; color:#7e57c2;">■ Station 1</span>
    <span style="margin-left:10px; color:#1e88e5;">■ Station 2</span>
    <span style="margin-left:10px; color:#43a047;">■ Station 3</span>
    <span style="margin-left:10px; color:#e53935;">■ Rework</span>
  </div>

  <div id="chart"></div>
  <div id="status">Loading...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBePrEYgwU4tD9h82n9PbjfxtTyQMXm6Kk",
      authDomain: "qrcodetesting-4f86e.firebaseapp.com",
      projectId: "qrcodetesting-4f86e",
      storageBucket: "qrcodetesting-4f86e.firebasestorage.app",
      messagingSenderId: "746921254909",
      appId: "1:746921254909:web:7acce026b9d96c97880394"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const statusEl = document.getElementById("status");
    const setStatus = (msg) => {
      statusEl.textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2);
    };

    google.charts.load("current", { packages: ["timeline"] });

    function tsToDate(ts) {
      if (!ts) return null;
      if (typeof ts.toDate === "function") return ts.toDate();
      if (typeof ts === "number") return new Date(ts);
      return null;
    }

    function roundToNearestMinute(date) {
      const d = new Date(date);
      if (d.getSeconds() >= 30) d.setMinutes(d.getMinutes() + 1);
      d.setSeconds(0, 0);
      return d;
    }

    function getPhaseFromStatus(status) {
    const s = (status || "").toLowerCase();
    return s.includes("rework") ? "rework" : "process";
    }

    function normalizeStatus(s) { return (s || "").trim().toLowerCase(); }

    function isStartStatus(s) {
      const t = normalizeStatus(s);
      return t === "start process" || t === "rework start";
    }
    function isEndStatus(s) {
      const t = normalizeStatus(s);
      return t === "end process" || t === "rework end";
    }
    function phaseFromEvent(e) {
      if (e.phase) return e.phase; // preferred
      return normalizeStatus(e.status).includes("rework") ? "Rework" : "Process";
    }

    function barColor(station, phase) {
      if (phase === "rework") return "#e53935"; // red
      if (station === "Station 1") return "#7e57c2"; // purple
      if (station === "Station 2") return "#1e88e5"; // blue
      if (station === "Station 3") return "#43a047"; // green
      return "#757575";
    }

    function formatTooltip(taskName, stationLabel, phase, employeeName, employeeNumber, start, end, isOngoing) {
      const dateFmt = new Intl.DateTimeFormat("en-GB", { day:"2-digit", month:"2-digit", year:"numeric" });
      const weekdayFmt = new Intl.DateTimeFormat("en-GB", { weekday:"long" });
      const timeFmt = new Intl.DateTimeFormat("en-GB", { hour:"numeric", minute:"2-digit", hour12:true });

      const startStr = `${dateFmt.format(start)} (${weekdayFmt.format(start)}) at ${timeFmt.format(start)}`;
      const endStr = isOngoing ? "(Ongoing)" : `${dateFmt.format(end)} (${weekdayFmt.format(end)}) at ${timeFmt.format(end)}`;

      const emp = `${employeeName || "-"} (${employeeNumber || "-"})`;

      return `
        <div style="padding:8px 10px">
          <div style="margin-bottom:6px"><b>${taskName}</b></div>
          <div>Phase: <b>${phase}</b></div>
          <div>Station: <b>${stationLabel}</b></div>
          <div>Employee: <b>${emp}</b></div>
          <div>Start: ${startStr}</div>
          <div>End: ${endStr}</div>
        </div>
      `;
    }

    function keyOf(serial, station, phase) {
    return `${serial}||${station}||${phase}`;
    }

    function buildSegmentsFromEvents(events) {
      const groups = new Map();

      for (const e of events) {
        const serial = e.serialNumber;
        const station = e.location;
        const phase = getPhaseFromStatus(e.status);
        const createdAt = tsToDate(e.createdAt);
        if (!serial || !station || !createdAt) continue;

        const k = keyOf(serial, station, phase);

        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push({ ...e, _t: createdAt, _phase: phase });
      }

      const segments = [];
      const issues = [];

      for (const [k, arr] of groups.entries()) {
        arr.sort((a, b) => a._t - b._t);

        let startEvent = null;

        for (const ev of arr) {
          if (isStartStatus(ev.status)) {
            startEvent = ev;
          } else if (isEndStatus(ev.status)) {
            if (!startEvent) {
              issues.push({ type: "end_without_start", serialNumber: ev.serialNumber, station: ev.location, phase: ev._phase });
              continue;
            }

            const start = roundToNearestMinute(startEvent._t);
            const end = roundToNearestMinute(ev._t);

            if (end < start) {
              issues.push({ type: "end_before_start", serialNumber: ev.serialNumber, station: ev.location, phase: ev._phase });
              startEvent = null;
              continue;
            }

            segments.push({
              serial: ev.serialNumber,
              projectName: ev.projectName || startEvent.projectName || "(No Project)",
              station: ev.location,
              phase: ev._phase,
              employeeName: startEvent.employeeName || ev.employeeName,
              employeeNumber: startEvent.employeeNumber || ev.employeeNumber,
              start,
              end,
              _ongoing: false
            });

            startEvent = null;
          }
        }

        // ongoing segment (started but no end)
        if (startEvent) {
          segments.push({
            serial: startEvent.serialNumber,
            projectName: startEvent.projectName || "(No Project)",
            station: startEvent.location,
            phase: startEvent._phase,
            employeeName: startEvent.employeeName,
            employeeNumber: startEvent.employeeNumber,
            start: roundToNearestMinute(startEvent._t),
            end: roundToNearestMinute(new Date()),
            _ongoing: true
          });
        }
      }

      return { segments, issues };
    }

    function buildDailyTicks(minDate, maxDate) {
      const ticks = [];
      const d = new Date(minDate);
      d.setHours(0, 0, 0, 0);

      const end = new Date(maxDate);
      end.setHours(0, 0, 0, 0);

      while (d <= end) {
        ticks.push(new Date(d));
        d.setDate(d.getDate() + 1);
      }
      return ticks;
    }

    function drawTimeline(segments) {
      const container = document.getElementById("chart");
      const chart = new google.visualization.Timeline(container);

      const data = new google.visualization.DataTable();
      data.addColumn({ type: "string", id: "Task" });
      data.addColumn({ type: "string", id: "Station" });
      data.addColumn({ type: "string", role: "style" });
      data.addColumn({ type: "string", role: "tooltip", p: { html: true } });
      data.addColumn({ type: "date", id: "Start" });
      data.addColumn({ type: "date", id: "End" });

      segments.sort((a, b) => {
        const aName = `${a.projectName} (${a.serial})`;
        const bName = `${b.projectName} (${b.serial})`;
        return aName.localeCompare(bName) || (a.start - b.start);
      });

      const rows = segments.map((s) => {
        const taskName = `${s.projectName} (${s.serial})`;
        const stationLabel = s.phase === "rework" ? `${s.station} (Rework)` : s.station;
        const style = "color: " + barColor(s.station, s.phase);
        const tooltip = formatTooltip(taskName, stationLabel, s.phase, s.employeeName, s.employeeNumber, s.start, s.end, s._ongoing === true);
        return [taskName, stationLabel, style, tooltip, s.start, s.end];
      });

      data.addRows(rows);

      // ----- Force date-only axis -----
      const minStart = new Date(Math.min(...segments.map(s => s.start.getTime())));
      const maxEnd   = new Date(Math.max(...segments.map(s => s.end.getTime())));

      minStart.setHours(0, 0, 0, 0);
      maxEnd.setHours(0, 0, 0, 0);

      const dailyTicks = buildDailyTicks(minStart, maxEnd);

     chart.draw(data, {
        tooltip: { isHtml: true },
        timeline: {
          rowLabelStyle: { fontSize: 12 },
          barLabelStyle: { fontSize: 11 }
        },
        hAxis: {
          viewWindow: { min: minStart, max: maxEnd },
          ticks: dailyTicks,
          format: "dd/MM/yyyy"
        }
      });
    }

    async function render() {
      try {
        setStatus("Reading Firestore collection: processLogs ...");
        const snap = await getDocs(collection(db, "processLogs"));
        const events = [];
        snap.forEach(d => events.push(d.data()));

        const { segments, issues } = buildSegmentsFromEvents(events);

        setStatus({
          collection: "processLogs",
          totalEvents: events.length,
          segmentsDrawn: segments.length,
          issuesFound: issues.length,
          issuesSample: issues.slice(0, 10)
        });

        if (segments.length === 0) {
          setStatus("No segments to draw yet.");
          return;
        }

        drawTimeline(segments);
      } catch (err) {
        console.error(err);
        setStatus("Error: " + (err.message || err));
      }
    }

    google.charts.setOnLoadCallback(() => render());
  </script>
</body>
</html>
